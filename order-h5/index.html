<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>想想要咋耍</title>
<script src="bmob.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --primary: #ff6b81;
    --primary-light: #ff8e53;
    --bg: #f7f7f9;
    --card: #fff;
    --text: #2d3436;
    --text-muted: #999;
    --radius: 16px;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    background: url('beauty-banner.png') center/cover fixed no-repeat;
    color: var(--text);
    font-size: 15px;
    padding-bottom: 140px;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,0.5);
    z-index: 0;
    pointer-events: none;
  }

  /* ===== 顶部 ===== */
  .header {
    position: relative;
    z-index: 1;
    color: #fff;
    padding: 40px 16px 50px;
    text-align: center;
  }
  .header h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
  .header p { font-size: 13px; opacity: 0.95; text-shadow: 0 1px 6px rgba(0,0,0,0.4); }
  .dish-info .price::before { content: "¥"; font-size: 12px; margin-right: 2px; }
  .dish-info .price::after { content: "/小时"; font-size: 11px; color: var(--text-muted); margin-left: 2px; }

  /* ===== 分类栏 ===== */
  .cat-bar {
    display: flex;
    background: rgba(255,255,255,0.9);
    padding: 0 12px;
    position: sticky;
    top: 0;
    z-index: 10;
    overflow-x: auto;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }
  .cat-bar::-webkit-scrollbar { display: none; }
  .cat-item {
    padding: 14px 16px;
    font-size: 14px;
    color: #666;
    white-space: nowrap;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }
  .cat-item.active {
    color: var(--primary);
    border-bottom-color: var(--primary);
    font-weight: 600;
  }

  /* ===== 菜品列表 ===== */
  .dish-list { padding: 12px; }
  .dish-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    transition: transform 0.15s;
  }
  .dish-card:active { transform: scale(0.98); }
  .dish-info .name { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  .dish-info .desc { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
  .dish-info .price {
    color: var(--primary);
    font-weight: 700;
    font-size: 18px;
  }

  /* ===== 加减按钮 ===== */
  .op { display: flex; align-items: center; gap: 8px; }
  .btn-plus, .btn-minus {
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    cursor: pointer;
    border: none;
    transition: all 0.15s;
  }
  .btn-plus { background: var(--primary); color: #fff; }
  .btn-plus:active { background: #e55a70; transform: scale(0.9); }
  .btn-minus {
    background: #fff; color: var(--primary);
    border: 1.5px solid var(--primary);
  }
  .btn-minus:active { background: #fff0f3; transform: scale(0.9); }
  .cnt { min-width: 24px; text-align: center; font-weight: 600; font-size: 15px; }

  /* ===== 底部购物车条 ===== */
  .cart-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: #fff;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 -2px 12px rgba(0,0,0,0.08);
    z-index: 100;
  }
  .cart-left { display: flex; align-items: center; gap: 8px; }
  .cart-icon {
    width: 36px; height: 36px;
    background: #fff0f3;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .cart-amount { font-size: 17px; font-weight: 700; color: var(--primary); }
  .cart-go {
    background: var(--primary);
    color: #fff;
    padding: 12px 28px;
    border-radius: 24px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all 0.15s;
  }
  .cart-go:active { background: #e55a70; transform: scale(0.96); }
  .cart-go:disabled { background: #ccc; }

  /* ===== 结算抽屉 ===== */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 200;
    display: none;
    animation: fadeIn 0.2s;
  }
  .overlay.show { display: block; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .drawer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: #fff;
    border-radius: 20px 20px 0 0;
    z-index: 201;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    max-height: 80vh;
    display: flex;
    flex-direction: column;
  }
  .drawer.show { transform: translateY(0); }
  .drawer-handle {
    width: 40px; height: 4px;
    background: #ddd;
    border-radius: 2px;
    margin: 12px auto 0;
  }
  .drawer-head {
    padding: 12px 16px;
    border-bottom: 1px solid #f0f0f0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .drawer-head h3 { font-size: 17px; font-weight: 600; }
  .close {
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: #999; cursor: pointer;
    border-radius: 50%;
  }
  .close:active { background: #f0f0f0; }
  .drawer-body { padding: 16px; overflow-y: auto; flex: 1; }

  .order-item {
    display: flex;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px dashed #f0f0f0;
  }
  .order-item:last-child { border-bottom: none; }
  .order-item .nm { font-size: 14px; }
  .order-item .pr { color: var(--primary); font-weight: 600; font-size: 14px; }

  .remark-box { margin-top: 16px; }
  .remark-box label {
    font-size: 13px;
    color: var(--text-muted);
    display: block;
    margin-bottom: 8px;
  }
  .remark-box textarea {
    width: 100%;
    border: 1.5px solid #e8e8e8;
    border-radius: 12px;
    padding: 12px;
    font-size: 14px;
    resize: none;
    height: 80px;
    font-family: inherit;
    transition: border-color 0.2s;
  }
  .remark-box textarea:focus {
    outline: none;
    border-color: var(--primary);
  }

  .submit-btn {
    margin: 16px;
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    color: #fff;
    border: none;
    border-radius: 28px;
    padding: 15px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    box-shadow: 0 4px 12px rgba(255,107,129,0.3);
  }
  .submit-btn:active { transform: scale(0.98); box-shadow: 0 2px 6px rgba(255,107,129,0.3); }
  .submit-btn:disabled { background: #ccc; box-shadow: none; }

  /* ===== Toast ===== */
  .toast {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    background: rgba(0,0,0,0.8);
    color: #fff;
    padding: 14px 24px;
    border-radius: 12px;
    font-size: 14px;
    z-index: 300;
    display: none;
    animation: fadeIn 0.2s;
  }

  /* 音乐开关 */
  .music-btn {
    position: fixed;
    top: 16px; right: 16px;
    width: 40px; height: 40px;
    background: rgba(255,255,255,0.9);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    cursor: pointer;
    z-index: 150;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  .music-btn.playing { animation: spin 3s linear infinite; }
  @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }

  /* 登录弹窗 */
  .login-modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 400;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .login-modal.show { display: flex; }
  .login-box {
    background: #fff;
    border-radius: 20px;
    padding: 30px 24px;
    width: 85%;
    max-width: 320px;
    text-align: center;
  }
  .login-box h2 { font-size: 18px; margin-bottom: 8px; }
  .login-box p { font-size: 13px; color: #999; margin-bottom: 20px; }
  .login-box input {
    width: 100%;
    border: 2px solid #e8e8e8;
    border-radius: 12px;
    padding: 12px;
    font-size: 15px;
    text-align: center;
    margin-bottom: 16px;
    box-sizing: border-box;
  }
  .login-box input:focus { outline: none; border-color: var(--primary); }
  .login-box button {
    width: 100%;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 24px;
    padding: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .user-tag {
    position: fixed;
    top: 16px; left: 16px;
    background: rgba(255,255,255,0.9);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 13px;
    color: var(--primary);
    z-index: 150;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }

  /* 登录页面 */
  .login-page {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #ff6b81, #ff8e53);
    z-index: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .login-box {
    background: #fff;
    border-radius: 24px;
    padding: 32px 24px;
    width: 100%;
    max-width: 360px;
  }
  .login-box h2 {
    text-align: center;
    font-size: 22px;
    margin-bottom: 8px;
  }
  .login-box .sub {
    text-align: center;
    font-size: 13px;
    color: #999;
    margin-bottom: 24px;
  }
  .login-box input {
    width: 100%;
    border: 2px solid #e8e8e8;
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 15px;
    margin-bottom: 12px;
    box-sizing: border-box;
  }
  .login-box input:focus { outline: none; border-color: var(--primary); }
  .login-box .btn-primary {
    width: 100%;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 24px;
    padding: 13px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
  }
  .login-box .btn-ghost {
    width: 100%;
    background: none;
    border: none;
    color: #999;
    font-size: 13px;
    margin-top: 12px;
    cursor: pointer;
  }
  .login-box .error {
    color: #ff4757;
    font-size: 12px;
    text-align: center;
    margin-bottom: 10px;
    min-height: 16px;
  }
</style>
</head>
<body>

<!-- 登录页 -->
<div class="login-page" id="loginPage">
  <div class="login-box">
    <h2>🎮 今天玩什么</h2>
    <div class="sub" id="loginSub">登录后才能点单哦</div>
    <div class="error" id="loginError"></div>
    <input type="email" id="loginEmail" placeholder="邮箱">
    <input type="password" id="loginPwd" placeholder="密码" maxlength="20">
    <button class="btn-primary" id="loginBtn">登录</button>
    <button class="btn-ghost" id="toRegister">没有账号？点我注册</button>
    <button class="btn-ghost" id="backToLogin" style="display:none">返回登录</button>
  </div>
</div>

<div class="header">
  <h1>🎮 今天玩什么</h1>
  <p>选好你想玩的，TA 就会收到通知</p>
</div>

<div class="cat-bar" id="catBar"></div>

<div class="dish-list" id="dishList"></div>

<div class="cart-bar">
  <button class="cart-go" id="goCart" disabled>去结算</button>
  <div class="cart-left">
    <div class="cart-icon">🛒</div>
    <div class="cart-amount" id="amount">¥0</div>
  </div>
</div>

<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-handle"></div>
  <div class="drawer-head">
    <h3>确认订单</h3>
    <div class="close" id="closeDrawer">×</div>
  </div>
  <div class="drawer-body">
    <div id="orderItems"></div>
    <div class="remark-box">
      <label>备注（爱不爱我）</label>
      <textarea id="remark" placeholder="例如：爱，不爱"></textarea>
    </div>
  </div>
  <button class="submit-btn" id="submitBtn">提交需求</button>
</div>

<div class="toast" id="toast"></div>

<audio id="bgm" src="music.mp3" loop preload="auto"></audio>
<div class="music-btn" id="musicBtn">🎵</div>
<div class="user-tag" id="userTag" style="display:none"></div>

<script>
// ===== Bmob 配置 =====
Bmob.initialize('c28c2b7bc5fa39604bacf45783d36dbf', '78b6da0acec9635715af2693dc5e229c');

// ===== 登录逻辑 =====
let isRegisterMode = false;
let currentUser = null;
let userName = '';

const loginPage = document.getElementById('loginPage');
const loginEmail = document.getElementById('loginEmail');
const loginPwd = document.getElementById('loginPwd');
const loginBtn = document.getElementById('loginBtn');
const loginError = document.getElementById('loginError');
const loginSub = document.getElementById('loginSub');
const toRegister = document.getElementById('toRegister');
const backToLogin = document.getElementById('backToLogin');

toRegister.onclick = () => {
  isRegisterMode = true;
  loginSub.textContent = '注册账号';
  loginBtn.textContent = '注册';
  toRegister.style.display = 'none';
  backToLogin.style.display = 'block';
  loginError.textContent = '';
};
backToLogin.onclick = () => {
  isRegisterMode = false;
  loginSub.textContent = '登录后才能点单哦';
  loginBtn.textContent = '登录';
  toRegister.style.display = 'block';
  backToLogin.style.display = 'none';
  loginError.textContent = '';
};

loginBtn.onclick = async () => {
  const email = loginEmail.value.trim();
  const pwd = loginPwd.value;
  if (!email || !pwd) { loginError.textContent = '请输入邮箱和密码'; return; }
  loginBtn.disabled = true;
  loginBtn.textContent = '请稍候...';
  loginError.textContent = '';
  try {
    if (isRegisterMode) {
      await Bmob.User.register({ username: email, password: pwd, email: email });
      loginError.style.color = '#52c41a';
      loginError.textContent = '注册成功，请登录';
      setTimeout(() => backToLogin.onclick(), 1000);
    } else {
      const res = await Bmob.User.login(email, pwd);
      currentUser = res;
      onLoginSuccess(res);
    }
  } catch (e) {
    loginError.style.color = '#ff4757';
    loginError.textContent = e.message || e.error || '操作失败';
  }
  loginBtn.disabled = false;
  loginBtn.textContent = isRegisterMode ? '注册' : '登录';
};

function onLoginSuccess(user) {
  loginPage.style.display = 'none';
  userName = (user.username || user.email || '用户').split('@')[0];
  localStorage.setItem('bmobUser', JSON.stringify(user));
  refreshUserTag();
}

// 页面加载时检查本地登录状态
const savedUser = localStorage.getItem('bmobUser');
if (savedUser) {
  currentUser = JSON.parse(savedUser);
  onLoginSuccess(currentUser);
}
// ===== 配置区（改这里就行） =====
// 菜单数据：自己增删改
const MENU = [
  { name: '打瓦',   cat: '游戏', price: 1, desc: '下饭神器' },
  { name: '通电话 打视频',     cat: '联系', price: 1, desc: '恩爱专属' },
  { name: '刷抖音一起',     cat: '娱乐', price: 1,  desc: '嘻嘻哈哈' },
  { name: '自由活动',     cat: '其他', price: 1,  desc: '呜呜呜' },
];
// ============== 配置区结束 ==============

let cart = {};
let activeCat = '全部';

function renderCats() {
  const cats = ['全部', ...new Set(MENU.map(m => m.cat))];
  document.getElementById('catBar').innerHTML = cats.map(c =>
    `<div class="cat-item ${c===activeCat?'active':''}" data-cat="${c}">${c}</div>`
  ).join('');
  document.querySelectorAll('.cat-item').forEach(el => {
    el.onclick = () => {
      activeCat = el.dataset.cat;
      renderCats();
      renderDishes();
    };
  });
}

function renderDishes() {
  const list = activeCat === '全部' ? MENU : MENU.filter(m => m.cat === activeCat);
  document.getElementById('dishList').innerHTML = list.map(m => {
    const cnt = cart[m.name] || 0;
    return `<div class="dish-card">
      <div class="dish-info">
        <div class="name">${m.name}</div>
        <div class="desc">${m.desc}</div>
        <div class="price">${m.price}</div>
      </div>
      <div class="op">
        ${cnt > 0 ? `<button class="btn-minus" data-name="${m.name}">−</button><span class="cnt">${cnt}</span>` : ''}
        <button class="btn-plus" data-name="${m.name}">+</button>
      </div>
    </div>`;
  }).join('');

  document.querySelectorAll('.btn-plus').forEach(b => b.onclick = () => changeCart(b.dataset.name, 1));
  document.querySelectorAll('.btn-minus').forEach(b => b.onclick = () => changeCart(b.dataset.name, -1));
}

function changeCart(name, delta) {
  cart[name] = (cart[name] || 0) + delta;
  if (cart[name] <= 0) delete cart[name];
  renderDishes();
  updateBar();
}

function updateBar() {
  let total = 0, count = 0;
  for (const [name, cnt] of Object.entries(cart)) {
    const dish = MENU.find(m => m.name === name);
    total += dish.price * cnt;
    count += cnt;
  }
  document.getElementById('amount').textContent = '¥' + total;
  const btn = document.getElementById('goCart');
  btn.disabled = count === 0;
  btn.textContent = count > 0 ? `去结算（${count}份）` : '去结算';
}

// 打开结算抽屉
document.getElementById('goCart').onclick = () => {
  const items = Object.entries(cart).map(([name, cnt]) => {
    const dish = MENU.find(m => m.name === name);
    return `<div class="order-item">
      <span class="nm">${name} × ${cnt}</span>
      <span class="pr">¥${dish.price * cnt}</span>
    </div>`;
  }).join('');
  document.getElementById('orderItems').innerHTML = items;
  document.getElementById('overlay').classList.add('show');
  document.getElementById('drawer').classList.add('show');
};

function closeDrawer() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('drawer').classList.remove('show');
}
document.getElementById('closeDrawer').onclick = closeDrawer;
document.getElementById('overlay').onclick = closeDrawer;

// 提交订单
document.getElementById('submitBtn').onclick = async () => {
  const btn = document.getElementById('submitBtn');
  const remark = document.getElementById('remark').value.trim();

  if (Object.keys(cart).length === 0) return;

  let total = 0, detail = [];
  for (const [name, cnt] of Object.entries(cart)) {
    const dish = MENU.find(m => m.name === name);
    total += dish.price * cnt;
    detail.push(`${name}×${cnt}（¥${dish.price * cnt}）`);
  }

  btn.disabled = true;
  btn.textContent = '提交中...';

  const title = `🍽️ ${userName || '神秘人'}点了 ${Object.keys(cart).length} 道`;
  const desp = `### ${userName || '神秘人'} 的订单\n\n` +
    detail.map(d => `- ${d}`).join('\n') +
    `\n\n**合计：¥${total}**\n\n` +
    (remark ? `**备注：** ${remark}\n` : '') +
    `\n---\n下单时间：${new Date().toLocaleString('zh-CN')}`;

  try {
    const data = await Bmob.Function.call('sendOrderNotify', { content: title, desp: desp });
    if (data.code === 0 || data.errno === 0) {
      showToast('✅ 下单成功，TA 会收到通知');
      cart = {};
      document.getElementById('remark').value = '';
      renderDishes();
      updateBar();
      setTimeout(closeDrawer, 1200);
    } else {
      showToast('提交失败：' + (data.message || data.error || '未知错误'));
    }
  } catch (e) {
    showToast('网络错误，请重试');
  }
  btn.disabled = false;
  btn.textContent = '提交需求';
};

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2000);
}

// 初始化
renderCats();
renderDishes();
updateBar();

// ===== 登录/昵称系统 =====
const loginModal = document.getElementById('loginModal');
const nameInput = document.getElementById('nameInput');
const userTag = document.getElementById('userTag');

function refreshUserTag() {
  if (userName) {
    userTag.textContent = '👤 ' + userName + '（点我登出）';
    userTag.style.display = 'block';
  } else {
    userTag.style.display = 'none';
  }
}
userTag.onclick = async () => {
  if (confirm('确定要登出吗？')) {
    currentUser = null;
    localStorage.removeItem('bmobUser');
    userName = '';
    refreshUserTag();
    loginPage.style.display = 'flex';
  }
};

// 背景音乐控制
const bgm = document.getElementById('bgm');
const musicBtn = document.getElementById('musicBtn');
let musicStarted = false;

function toggleMusic() {
  if (bgm.paused) {
    bgm.play();
    musicBtn.classList.add('playing');
    musicBtn.textContent = '🎵';
  } else {
    bgm.pause();
    musicBtn.classList.remove('playing');
    musicBtn.textContent = '🔇';
  }
}
musicBtn.onclick = (e) => {
  e.stopPropagation();
  toggleMusic();
};

// 浏览器限制：第一次点击页面任意位置后自动开始播放
document.body.addEventListener('click', function once() {
  if (!musicStarted) {
    musicStarted = true;
    bgm.play().then(() => {
      musicBtn.classList.add('playing');
    }).catch(() => {});
    document.body.removeEventListener('click', once);
  }
}, { once: true });
</script>
